services:
  postgres:
    image: postgres:16-alpine
    container_name: ariszay-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ariszay
      POSTGRES_PASSWORD: ariszay_dev_password
      POSTGRES_DB: ariszay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
